name: Checks, build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_IMAGE: raikasha/greedybear-connector

jobs:
  # Mirrors the checks run by the OpenCTI connectors monorepo (isort/black/flake8/pylint)
  # plus the connector's own pytest suite. The Filigran-internal STIX-id pylint plugin
  # runs centrally in the monorepo, so it is not duplicated here.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: |
          pip install black flake8 isort pylint
          pip install -r src/requirements.txt -r tests/test-requirements.txt

      - name: isort
        run: isort --profile black --check src/ tests/

      - name: black
        run: black --check src/ tests/

      - name: flake8
        run: flake8 --ignore=E,W src/

      - name: pylint
        run: pylint --disable=all --enable=no-value-for-parameter,unused-import src/

      - name: pytest
        run: PYTHONPATH=src pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
